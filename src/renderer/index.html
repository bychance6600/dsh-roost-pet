<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>dsh-roost-pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bubble-zone">
        <div id="bubble" hidden>
          <span id="bubble-text"></span>
        </div>
      </div>

      <div id="body-zone">
        <div id="pet" aria-hidden="true">
          <span class="eye left"></span>
          <span class="eye right"></span>
        </div>
      </div>
    </div>

    <div id="status" hidden>
      <span id="status-state"></span>
      <span id="status-why"></span>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
